services:
    php_bds:
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        volumes:
            - ./:/var/www/html
            - ./docker/php-fpm/www.8c16g.conf:/usr/local/etc/php-fpm.d/zz-pm.conf:ro
            - ./docker/php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
        restart: unless-stopped
        networks:
            - internal
        depends_on:
            - mysql_bds

    mysql_bds:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: passion_bds
            MYSQL_USER: passion_bds
            MYSQL_PASSWORD: passion_bds
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
        networks:
            - internal
        ports:
            - "3307:3306" # host 3307 -> container 3306 (for Adminer / DBeaver etc.)

    phpmyadmin:
        profiles: ["debug"] # only run when "docker-compose --profile debug up" is used
        image: phpmyadmin:latest
        depends_on:
            - mysql_bds
        environment:
            PMA_HOST: mysql_bds
            PMA_PORT: 3306
            PMA_ARBITRARY: 0   # disable arbitrary servers, only mysql_bds
        restart: unless-stopped
        ports:
            - "127.0.0.1:8081:80"  # only accessible from localhost (dev + prod)
        networks:
            - internal

    passion_bds:
        image: nginx:1.27-alpine
        depends_on:
            - php_bds
        expose:
            - "80"
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:ro
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        restart: unless-stopped
        networks:
            - internal
            - caddy

networks:
    internal:
        driver: bridge

    caddy:
        external: true
        name: app_default

volumes:
    mysql_data:
