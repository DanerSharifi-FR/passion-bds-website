; =========================
; NEW: OPcache tuning for 4c/8g box (Laravel)
; =========================
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=60000

; In production you want this off (no stat checks each request)
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Keep it off unless you know what you're doing
opcache.jit=0

