; =========================
; OPcache tuning for 1 vCPU / 1 GB RAM (Laravel)
; =========================
opcache.enable=1

; Keep shared memory small on a tiny box
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=20000

; Production: no stat() checks per request
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Don’t waste RAM on JIT
opcache.jit=0
opcache.jit_buffer_size=0

; Avoid duplicating OPcache for artisan/CLI on a small box
opcache.enable_cli=0

; Safe defaults for frameworks/libraries relying on docblocks
opcache.save_comments=1
opcache.max_wasted_percentage=10

